# AgentGate Configuration
# Environment variables with AGENTGATE_ prefix override these settings.
# Example: AGENTGATE_SERVER_ADDR=:9090 overrides server.addr

server:
  addr: ":8080"
  cors_origins: []
  # cors_origins:
  #   - "http://localhost:5174"
  #   - "https://console.agentgate.io"

database:
  dsn: "file:agentgate.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(ON)"

auth:
  adapter_tokens:
    - "adapter-local-token"
  operator_tokens:
    - "operator-local-token"
  admin_tokens:
    - "admin-local-token"

policy:
  path: "config/default_policy.json"
