host: localhost:8080
info:
  contact: {}
  description: Policy decision and control plane for agentic systems.
  title: AgentGate API
  version: 1.0.0
paths:
  /healthz:
    get:
      description: Returns the service status and start time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /internal/agent-types:
    get:
      description: Returns the built-in agent types and their default capabilities.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.AgentTypesResponse'
      security:
      - BearerAuth: []
      summary: List supported agent types
      tags:
      - integrations
  /internal/integrations:
    get:
      description: Returns all registered integration definitions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.IntegrationDefinition'
            type: array
      security:
      - BearerAuth: []
      summary: List integration definitions
      tags:
      - integrations
    post:
      consumes:
      - application/json
      description: Registers a new integration (adapter, resource, etc.).
      parameters:
      - description: Integration definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.IntegrationDefinition'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.IntegrationDefinition'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create an integration definition
      tags:
      - integrations
  /internal/integrations/{integration_id}:
    delete:
      description: Removes an integration definition.
      parameters:
      - description: Integration ID
        in: path
        name: integration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete an integration definition
      tags:
      - integrations
    get:
      description: Returns a single integration definition by ID.
      parameters:
      - description: Integration ID
        in: path
        name: integration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.IntegrationDefinition'
      security:
      - BearerAuth: []
      summary: Get an integration definition
      tags:
      - integrations
    patch:
      consumes:
      - application/json
      description: Updates an existing integration definition.
      parameters:
      - description: Integration ID
        in: path
        name: integration_id
        required: true
        type: string
      - description: Updated definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.IntegrationDefinition'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agentgate_agentgate_internal_types.IntegrationDefinition'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an integration definition
      tags:
      - integrations
  /internal/policy/bundles:
    get:
      description: Returns all policy bundles, optionally including archived ones.
      parameters:
      - description: include archived bundles
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_agentgate_agentgate_internal_policy.Bundle'
            type: array
      security:
      - BearerAuth: []
      summary: List policy bundles
      tags:
      - policy
    post:
      consumes:
      - application/json
      description: Creates a new policy bundle.
      parameters:
      - description: Bundle definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_agentgate_agentgate_internal_policy.Bundle'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_agentgate_agentgate_internal_policy.Bundle'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a policy bundle
      tags:
      - policy
  /internal/policy/bundles/{bundle_id}:
    delete:
      description: Archives (soft-deletes) a policy bundle.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a policy bundle
      tags:
      - policy
    get:
      description: Returns a single policy bundle by ID.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_agentgate_agentgate_internal_policy.Bundle'
      security:
      - BearerAuth: []
      summary: Get a policy bundle
      tags:
      - policy
    patch:
      consumes:
      - application/json
      description: Updates an existing policy bundle.
      parameters:
