basePath: /
definitions:
  core.PolicyPublishRequest:
    properties:
      bundle:
        $ref: '#/definitions/policy.Bundle'
      message:
        type: string
      operator_id:
        type: string
    type: object
  core.PolicyRollbackRequest:
    properties:
      message:
        type: string
      operator_id:
        type: string
      version:
        type: integer
    type: object
  core.PolicyValidateRequest:
    properties:
      bundle:
        $ref: '#/definitions/policy.Bundle'
    type: object
  policy.Bundle:
    properties:
      bundle_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      egress_policy:
        $ref: '#/definitions/policy.EgressPolicy'
      input_policy:
        $ref: '#/definitions/policy.InputPolicy'
      issued_at:
        type: string
      name:
        type: string
      path_policy:
        $ref: '#/definitions/policy.PathPolicy'
      priority:
        type: integer
      resource_policy:
        $ref: '#/definitions/policy.ResourcePolicy'
      rules:
        items:
          $ref: '#/definitions/policy.Rule'
        type: array
      runtime_policy:
        $ref: '#/definitions/policy.RuntimePolicy'
      status:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  policy.Condition:
    properties:
      expression:
        type: string
      language:
        type: string
    type: object
  policy.EgressPolicy:
    properties:
      block_sensitive_query_params:
        items:
          type: string
        type: array
      host_allowlist:
        items:
          type: string
        type: array
      require_purpose_declaration:
        type: boolean
    type: object
  policy.InputPolicy:
    properties:
      secret_mode:
        type: string
    type: object
  policy.Obligation:
    properties:
      params:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  policy.PathPolicy:
    properties:
      allow_worktree_siblings:
        type: boolean
      blocked_prefixes:
        items:
          type: string
        type: array
      workspace_root:
        type: string
    type: object
  policy.ResourcePolicy:
    properties:
      secret_handle_scope:
        type: string
    type: object
  policy.Rule:
    properties:
      description:
        type: string
      effect:
        $ref: '#/definitions/types.Effect'
      id:
        type: string
      obligations:
        items:
          $ref: '#/definitions/policy.Obligation'
        type: array
      priority:
        type: integer
      reason_code:
        type: string
      request_kinds:
        items:
          $ref: '#/definitions/types.RequestKind'
        type: array
      surface:
        $ref: '#/definitions/types.Surface'
      when:
        $ref: '#/definitions/policy.Condition'
    type: object
  policy.RuntimePolicy:
    properties:
      require_approval_open_world:
        type: boolean
      require_approval_side_effects:
        items:
          type: string
        type: array
      require_approval_tools:
        items:
          type: string
        type: array
    type: object
  types.ActionContext:
    properties:
      open_world:
        type: boolean
      operation:
        type: string
      side_effects:
        items:
          type: string
        type: array
      tool:
        type: string
    type: object
  types.ActorContext:
    properties:
      agent_id:
        type: string
      host_id:
        type: string
      user_id:
        type: string
    type: object
  types.AdapterCapabilities:
    properties:
      can_block:
        type: boolean
      can_rewrite_input:
        type: boolean
      can_rewrite_tool_args:
        type: boolean
    type: object
  types.AdapterRegistration:
    properties:
      adapter_id:
        type: string
      adapter_kind:
        type: string
      capabilities:
        $ref: '#/definitions/types.AdapterCapabilities'
      host:
        $ref: '#/definitions/types.HostDescriptor'
      integration_id:
        type: string
      metadata:
        additionalProperties: true
        type: object
      supporting_channels:
        items:
          type: string
        type: array
      surfaces:
        items:
          $ref: '#/definitions/types.Surface'
        type: array
    type: object
  types.ApprovalRecord:
    properties:
      approval_id:
        type: string
      attempt_id:
        type: string
      channel:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      operator_id:
        type: string
      reason:
        type: string
      request_id:
        type: string
      resolved_at:
        type: string
      session_id:
        type: string
      status:
        $ref: '#/definitions/types.ApprovalStatus'
      task_id:
        type: string
    type: object
  types.ApprovalResolveRequest:
    properties:
      channel:
        type: string
      decision:
        type: string
      operator_id:
        type: string
    type: object
  types.ApprovalStatus:
    enum:
    - pending
    - approved
    - denied
    - expired
    type: string
    x-enum-varnames:
    - ApprovalPending
    - ApprovalApproved
    - ApprovalDenied
    - ApprovalExpired
  types.ContentContext:
    properties:
      data_classes:
        items:
          $ref: '#/definitions/types.DataClass'
        type: array
      summary:
        type: string
    type: object
  types.DataClass:
    enum:
    - pii
    - secret
    - business
    - financial
    - credential
    type: string
    x-enum-varnames:
    - DataClassPII
    - DataClassSecret
    - DataClassBusiness
    - DataClassFinancial
    - DataClassCredential
  types.DecisionContext:
    properties:
      raw:
        additionalProperties: true
        type: object
      surface:
        $ref: '#/definitions/types.Surface'
      taints:
        items:
          $ref: '#/definitions/types.Taint'
        type: array
    type: object
  types.DecisionExplanation:
    properties:
      policy_trace:
        $ref: '#/definitions/types.PolicyTrace'
      summary:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  types.Effect:
    enum:
    - allow
    - allow_with_audit
    - approval_required
    - deny
    - exclusion
    type: string
    x-enum-varnames:
    - EffectAllow
    - EffectAllowWithAudit
    - EffectApprovalRequired
    - EffectDeny
    - EffectExclusion
  types.Disposition:
    enum:
    - allow
    - deny
    type: string
    x-enum-varnames:
    - DispositionAllow
    - DispositionDeny
  types.HostDescriptor:
    properties:
      kind:
        type: string
      version:
        type: string
    type: object
  types.IntegrationDefinition:
    properties:
      enabled:
        type: boolean
      expected_surfaces:
        items:
          $ref: '#/definitions/types.Surface'
        type: array
      health:
        $ref: '#/definitions/types.IntegrationHealth'
      id:
        type: string
      kind:
        type: string
      matched_adapters:
        items:
          $ref: '#/definitions/types.IntegrationMatchedAdapter'
        type: array
      name:
        type: string
    type: object
  types.IntegrationHealth:
    properties:
      computed_at:
        type: string
      last_seen_at:
        type: string
      matched_adapter_count:
        type: integer
      matched_adapter_id:
        type: string
      status:
        $ref: '#/definitions/types.IntegrationHealthStatus'
    type: object
  types.IntegrationHealthStatus:
    enum:
    - connected
    - stale
    - missing
    - unmanaged
    - disabled
    type: string
    x-enum-varnames:
    - IntegrationHealthConnected
    - IntegrationHealthStale
    - IntegrationHealthMissing
    - IntegrationHealthUnmanaged
    - IntegrationHealthDisabled
  types.IntegrationMatchedAdapter:
    properties:
      adapter_id:
        type: string
      adapter_kind:
        type: string
      host:
        $ref: '#/definitions/types.HostDescriptor'
      integration_id:
        type: string
      last_seen_at:
        type: string
      registered_at:
        type: string
      status:
        $ref: '#/definitions/types.IntegrationHealthStatus'
      supporting_channels:
        items:
          type: string
        type: array
      surfaces:
        items:
          $ref: '#/definitions/types.Surface'
        type: array
    type: object
  types.Obligation:
    properties:
      params:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  types.PolicyDecision:
    properties:
      applied_rules:
        items:
          type: string
        type: array
      decided_at:
        type: string
      decision_id:
        type: string
      disposition:
        $ref: '#/definitions/types.Disposition'
      explanation:
        $ref: '#/definitions/types.DecisionExplanation'
      obligations:
        items:
          $ref: '#/definitions/types.Obligation'
        type: array
      reason_code:
        type: string
      request_id:
        type: string
    type: object
  types.PolicyRequest:
    properties:
      action:
        $ref: '#/definitions/types.ActionContext'
      actor:
        $ref: '#/definitions/types.ActorContext'
      content:
        $ref: '#/definitions/types.ContentContext'
      context:
        $ref: '#/definitions/types.DecisionContext'
      policy:
        additionalProperties: true
        type: object
      request_id:
        type: string
      request_kind:
        $ref: '#/definitions/types.RequestKind'
      session:
        $ref: '#/definitions/types.SessionContext'
      target:
        $ref: '#/definitions/types.TargetContext'
    type: object
  types.PolicyRuleTrace:
    properties:
      bundle_id:
        type: string
      bundle_priority:
        type: integer
      effect:
        $ref: '#/definitions/types.Effect'
      priority:
        type: integer
      reason_code:
        type: string
      rule_id:
        type: string
    type: object
  types.PolicyTrace:
    properties:
      bundle_priority:
        type: integer
      defaulted:
        type: boolean
      matched_rules:
        items:
          $ref: '#/definitions/types.PolicyRuleTrace'
        type: array
      policy_status:
        type: string
      policy_version:
        type: integer
      selected_bundle:
        type: string
      selected_rule:
        type: string
      top_priority:
        type: integer
    type: object
  types.ReportRequest:
    properties:
      adapter_id:
        type: string
      decision_id:
        type: string
      error_message:
        type: string
      metadata:
        additionalProperties: true
        type: object
      obligations:
        items:
          $ref: '#/definitions/types.Obligation'
        type: array
      outcome:
        type: string
      request_id:
        type: string
      surface:
        $ref: '#/definitions/types.Surface'
    type: object
  types.RequestKind:
    enum:
    - input
    - tool_attempt
    - resource_egress
    - resource_access
    - initial_envelope
    - envelope_amendment
    type: string
    x-enum-varnames:
    - RequestKindInput
    - RequestKindToolAttempt
    - RequestKindResourceEgress
    - RequestKindResourceAccess
    - RequestKindInitialEnvelope
    - RequestKindEnvelopeAmendment
  types.SessionContext:
    properties:
      attempt_id:
        type: string
      session_id:
        type: string
      task_id:
        type: string
    type: object
  types.Surface:
    enum:
    - input
    - runtime
    - resource
    type: string
    x-enum-varnames:
    - SurfaceInput
    - SurfaceRuntime
    - SurfaceResource
  types.Taint:
    enum:
    - untrusted_external
    - possible_prompt_injection
    - embedded_instruction
    - secret_bearing
    type: string
    x-enum-varnames:
    - TaintUntrustedExternal
    - TaintPossibleInjection
    - TaintEmbeddedInstruction
    - TaintSecretBearing
  types.TargetContext:
    properties:
      identifier:
        type: string
      kind:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Policy decision and control plane for agentic systems.
  title: AgentGate API
  version: 1.0.0
paths:
  /healthz:
    get:
      description: Returns the service status and start time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /internal/integrations:
    get:
      description: Returns all registered integration definitions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/types.IntegrationDefinition'
            type: array
      security:
      - BearerAuth: []
      summary: List integration definitions
      tags:
      - integrations
    post:
      consumes:
      - application/json
      description: Registers a new integration (adapter, resource, etc.).
      parameters:
      - description: Integration definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.IntegrationDefinition'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/types.IntegrationDefinition'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create an integration definition
      tags:
      - integrations
  /internal/integrations/{integration_id}:
    delete:
      description: Removes an integration definition.
      parameters:
      - description: Integration ID
        in: path
        name: integration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete an integration definition
      tags:
      - integrations
    get:
      description: Returns a single integration definition by ID.
      parameters:
      - description: Integration ID
        in: path
        name: integration_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.IntegrationDefinition'
      security:
      - BearerAuth: []
      summary: Get an integration definition
      tags:
      - integrations
    patch:
      consumes:
      - application/json
      description: Updates an existing integration definition.
      parameters:
      - description: Integration ID
        in: path
        name: integration_id
        required: true
        type: string
      - description: Updated definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.IntegrationDefinition'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.IntegrationDefinition'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an integration definition
      tags:
      - integrations
  /internal/policy/bundles:
    get:
      description: Returns all policy bundles, optionally including archived ones.
      parameters:
      - description: include archived bundles
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/policy.Bundle'
            type: array
      security:
      - BearerAuth: []
      summary: List policy bundles
      tags:
      - policy
    post:
      consumes:
      - application/json
      description: Creates a new policy bundle.
      parameters:
      - description: Bundle definition
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/policy.Bundle'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/policy.Bundle'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a policy bundle
      tags:
      - policy
  /internal/policy/bundles/{bundle_id}:
    delete:
      description: Archives (soft-deletes) a policy bundle.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a policy bundle
      tags:
      - policy
    get:
      description: Returns a single policy bundle by ID.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.Bundle'
      security:
      - BearerAuth: []
      summary: Get a policy bundle
      tags:
      - policy
    patch:
      consumes:
      - application/json
      description: Updates an existing policy bundle.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      - description: Updated bundle
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/policy.Bundle'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.Bundle'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a policy bundle
      tags:
      - policy
  /internal/policy/bundles/{bundle_id}/publish:
    post:
      description: Publishes a stored policy bundle, making it active.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Publish a policy bundle by ID
      tags:
      - policy
  /internal/policy/bundles/{bundle_id}/validate:
    post:
      description: Validates a stored policy bundle.
      parameters:
      - description: Bundle ID
        in: path
        name: bundle_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Validate a policy bundle by ID
      tags:
      - policy
  /internal/policy/current:
    get:
      description: Returns the currently active policy bundle with all rules.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/policy.Bundle'
      security:
      - BearerAuth: []
      summary: Get active policy
      tags:
      - policy
  /internal/policy/publish:
    post:
      consumes:
      - application/json
      description: Validates and publishes a new policy version, making it active.
      parameters:
      - description: Policy to publish
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/core.PolicyPublishRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Publish a new policy version
      tags:
      - policy
  /internal/policy/rollback:
    post:
      consumes:
      - application/json
      description: Rolls back the active policy to a specified version.
      parameters:
      - description: Rollback parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/core.PolicyRollbackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rollback to a previous policy version
      tags:
      - policy
  /internal/policy/validate:
    post:
      consumes:
      - application/json
      description: Validates a policy bundle without publishing it.
      parameters:
      - description: Policy bundle to validate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/core.PolicyValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Validate a policy bundle
      tags:
      - policy
  /internal/policy/versions:
    get:
      description: Returns paginated policy version history.
      parameters:
      - description: max results (1-1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List policy versions
      tags:
      - policy
  /v1/approvals:
    get:
      description: Returns paginated list of approval records.
      parameters:
      - description: max results (1-1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/types.ApprovalRecord'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List approvals
      tags:
      - approvals
  /v1/approvals/{approval_id}/resolve:
    post:
      consumes:
      - application/json
      description: Approves or denies a pending approval request.
      parameters:
      - description: Approval ID
        in: path
        name: approval_id
        required: true
        type: string
      - description: Resolution (approved/denied)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.ApprovalResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Resolve an approval
      tags:
      - approvals
  /v1/coverage:
    get:
      description: Returns coverage information for registered adapters and their
        surfaces.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get adapter coverage
      tags:
      - adapter
  /v1/decide:
    post:
      consumes:
      - application/json
      description: Evaluates a policy request against all active rules and returns
        a decision.
      parameters:
      - description: Policy decision request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.PolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.PolicyDecision'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Make a policy decision
      tags:
      - decision
  /v1/events:
    get:
      description: Returns paginated event log.
      parameters:
      - description: max results (1-1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List events
      tags:
      - events
  /v1/register:
    post:
      consumes:
      - application/json
      description: Registers an adapter with its capabilities, surfaces, and host
        info.
      parameters:
      - description: Adapter registration
        in: body
        name: body
        required: true
